<div class="card shadow-sm mb-4">

    <div class="card-header">
        <h4 class="mb-0">📅 Build Trends</h4>
    </div>

    <div class="card-body">

        <table class="table table-striped">

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Total Builds</th>
                </tr>

            </thead>

            <tbody>

                {% for trend in build_trends %}

                <tr>

                    <td>{{ trend.day }}</td>

                    <td>

                        <span class="badge bg-info">

                            {{ trend.total_builds }}

                        </span>

                    </td>

                </tr>

                {% empty %}

                <tr>

                    <td colspan="2">
                        No trend data available.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>
