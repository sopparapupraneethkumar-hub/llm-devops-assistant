{% extends "base.html" %}
{% load static %}

{% block title %}
Authentication | LLM DevOps Assistant
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block body %}

<div class="container-fluid p-0">

    <div class="row g-0 auth-page">

        <!-- LEFT SIDE -->
        <div class="col-lg-6 d-none d-lg-block p-0">

            <div class="auth-image">

                <img
                    src="{% static 'images/login-hero.png' %}"
                    alt="LLM DevOps Assistant">

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-lg-6 d-flex justify-content-center align-items-center p-0">

            <div class="auth-container w-100">

                {% block auth_content %}
                {% endblock %}

            </div>

        </div>

    </div>

</div>

{% endblock %}
