{% extends "layouts/dashboard_layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body text-center p-5">

                    <div class="mb-4">

                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:70px;"></i>

                    </div>

                    <h2 class="fw-bold">

                        Delete Project

                    </h2>

                    <p class="text-muted mt-3">

                        Are you sure you want to delete

                    </p>

                    <h4 class="fw-bold">

                        {{ project.name }}

                    </h4>

                    <p class="text-danger">

                        This action cannot be undone and will delete associated pipelines.

                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-3 mt-4">

                            <a href="{% url 'project_list' %}" class="btn btn-outline-secondary btn-lg">

                                Cancel

                            </a>

                            <button type="submit" class="btn btn-danger btn-lg">

                                <i class="bi bi-trash-fill"></i>

                                Delete Project

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
