{% extends "base.html" %}

{% block content %}

<h2>My Projects</h2>

<a href="{% url 'project_create' %}" class="btn btn-primary">
    Create Project
</a>

<hr>

{% if projects %}

    {% for project in projects %}

        <div class="card mb-3">

            <div class="card-body">

                <h4>{{ project.name }}</h4>

                <p>{{ project.description }}</p>

                <a href="{% url 'project_update' project.id %}" class="btn btn-warning">
                    Edit
                </a>

                <a href="{% url 'project_delete' project.id %}" class="btn btn-danger">
                    Delete
                </a>

            </div>

        </div>

    {% endfor %}

{% else %}

<p>No projects available.</p>

{% endif %}

{% endblock %}
