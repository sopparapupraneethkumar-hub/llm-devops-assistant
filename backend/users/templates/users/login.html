{% extends "layouts/auth_layout.html" %}

{% block auth_content %}

<div class="auth-card">

    <div class="text-center mb-4">

        <i class="bi bi-cpu-fill display-4 text-primary"></i>

        <h2 class="mt-3">Welcome Back</h2>

        <p class="text-muted">
            Sign in to continue to your DevOps Dashboard
        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary auth-btn mt-3">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

    </form>

    <hr>

    <div class="text-center">

        Don't have an account?

        <a href="{% url 'register' %}">

            Register

        </a>

    </div>

</div>

{% endblock %}
