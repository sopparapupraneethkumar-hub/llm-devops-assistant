{% extends "layouts/auth_layout.html" %}

{% block auth_content %}

<div class="auth-card">

    <div class="text-center mb-5">

        <i class="bi bi-person-plus-fill display-4 text-primary"></i>

        <h2 class="mt-3">

            Create Account

        </h2>

        <p class="text-muted">

            Join the LLM DevOps Assistant Platform

        </p>

    </div>

    <form method="POST">

        {% csrf_token %}
        {% for field in form %}

        <div class="mb-3">

            {{ field.label_tag }}

            {{ field }}

            {{ field.errors }}

        </div>

        {% endfor %}

        <button type="submit" class="btn auth-btn mt-3">
            <i class="bi bi-person-check-fill"></i>
            Register
        </button>

    </form>

    <hr>

    <div class="text-center auth-footer">

        <p class="mb-2">

            Already have an account?

        </p>

        <a href="{% url 'login' %}" class="register-btn">

            Sign In →

        </a>

    </div>

</div>

{% endblock %}
