{% extends "layouts/auth_layout.html" %}

{% block auth_content %}

<div class="auth-card">

    <div class="text-center mb-4">

        <i class="bi bi-person-plus-fill display-4 text-primary"></i>

        <h2 class="mt-3">

            Create Account

        </h2>

        <p class="text-muted">

            Join the LLM DevOps Assistant Platform

        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success auth-btn mt-3">

            <i class="bi bi-person-check-fill"></i>

            Register

        </button>

    </form>

    <hr>

    <div class="text-center">

        Already have an account?

        <a href="{% url 'login' %}">

            Login

        </a>

    </div>

</div>

{% endblock %}
